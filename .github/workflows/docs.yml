name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Dokka
        run: ./gradlew :adaptive-chip-select:dokkaGenerate

      - name: Assemble site
        run: |
          mkdir -p _site/api
          cp -r adaptive-chip-select/build/dokka/html/* _site/api/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>adaptive-chip-select</title>
              <style>
                  body { max-width: 720px; margin: 4em auto; padding: 0 1em;
                         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                         line-height: 1.6; color: #e6edf3;
                         background: #0d1117; }
                  h1 { font-size: 2em; margin-bottom: 0.2em; color: #e6edf3; }
                  .subtitle { color: #7d8590; margin-bottom: 2em; }
                  .links { display: flex; gap: 1em; flex-wrap: wrap; }
                  .links a { display: inline-block; padding: 0.6em 1.2em;
                             border: 1px solid #30363d; border-radius: 6px;
                             text-decoration: none; color: #58a6ff;
                             font-weight: 500; background: #161b22;
                             transition: background 0.15s ease, border-color 0.15s ease; }
                  .links a:hover { background: #21262d; border-color: #58a6ff; }
                  .links a.primary { background: #238636; color: #ffffff;
                                     border-color: #238636; }
                  .links a.primary:hover { background: #2ea043; border-color: #2ea043; }
              </style>
          </head>
          <body>
              <h1>adaptive-chip-select</h1>
              <p class="subtitle">Adaptive chip selector for Compose: synchronized multi-row scrolling, magnetic snap, pager indicator, and single/multiple selection modes.</p>
              <div class="links">
                  <a class="primary" href="api/">API Documentation</a>
                  <a href="https://github.com/vkozhanova/AdaptiveChips">GitHub</a>
                  <a href="https://github.com/vkozhanova/AdaptiveChips#readme">README</a>
                  <a href="https://github.com/vkozhanova/AdaptiveChips/issues">Issues</a>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4