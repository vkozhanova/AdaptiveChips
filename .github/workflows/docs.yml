name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Dokka
        run: ./gradlew :adaptive-chip-select:dokkaGenerate

      - name: Assemble site
        run: |
          mkdir -p _site/api
          # Dokka at /api/
          cp -r adaptive-chip-select/build/dokka/html/* _site/api/
          # README as landing page at /
          pandoc README.md -o _site/index.html \
            --standalone \
            --metadata title="adaptive-chip-select" \
            --css=style.css
          # Minimal CSS
          cat > _site/style.css << 'EOF'
          body { max-width: 900px; margin: 2em auto; padding: 0 1em;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                 line-height: 1.6; color: #24292f; }
          h1, h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
          pre { background: #f6f8fa; padding: 1em; overflow-x: auto; border-radius: 6px; }
          code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
          pre code { background: none; padding: 0; }
          img { max-width: 100%; }
          table { border-collapse: collapse; margin: 1em 0; }
          th, td { border: 1px solid #d0d7de; padding: 0.5em 1em; }
          a { color: #0969da; }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4